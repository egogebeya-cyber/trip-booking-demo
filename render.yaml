services:
  - type: web
    name: trip-booking-demo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm install @rolldown/binding-linux-x64-gnu && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: NPM_CONFIG_OPTIONAL
        value: "true"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_ENABLED
        value: "true"
